# Gera o instalador do Windows e testa o jogo INSTALADO em uma máquina Windows real do GitHub.
name: Windows — build, instalação e testes

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # o commit anterior entra na conferência da versão antes de publicar

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Software atualizado e sem avisos de segurança (regra 18)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/freshness-check.js

      - name: Simulação prolongada (vários universos e temporadas)
        run: npm test

      - name: Saves de versões publicadas e determinismo
        shell: bash
        run: |
          node scripts/save-compat-check.js 12
          node scripts/determinism-check.js
          node scripts/determinism-check.js --pack
          node scripts/save-compat-check.js 12 --pack

      - name: Testes da interface (Playwright)
        shell: bash
        run: |
          npx playwright install chromium
          node scripts/build.js
          node scripts/ui85-check.js 3
          node scripts/playthrough-check.js 1
          node scripts/browser-save-check.js
          node scripts/i18n-check.js 0
          node scripts/web-desktop-check.js
          node scripts/fictional-check.js 2

      - name: Gerar Setup.exe
        run: npm run dist

      # (0.9, E25) quem já joga instala a versão nova por cima: o save da 0.8.7 publicada precisa sobreviver
      # à instalação sem mudar um byte e abrir na versão nova.
      - name: Atualização a partir da 0.8.7 publicada (o save não muda e abre na versão nova)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $data = "$env:APPDATA\PitWall Racing Simulator"
          $exe = "$env:LOCALAPPDATA\Programs\PitWall Racing Simulator\PitWall Racing Simulator.exe"
          function Install-Silent($setup) {
            for ($t = 1; $t -le 3; $t++) {
              $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
              if ($p.ExitCode -eq 0) { break }
              Write-Host "tentativa ${t}: código $($p.ExitCode)"; Start-Sleep 45
            }
            for ($i = 0; $i -lt 300; $i++) {
              $busy = Get-Process | Where-Object { $_.Name -like 'PitWall-Racing-Simulator-Setup*' }
              if ((Test-Path $exe) -and !$busy) { break }
              Start-Sleep 2
            }
            if (!(Test-Path $exe)) { throw "instalação não terminou: $setup" }
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          gh release download v0.8.7 --repo "${{ github.repository }}" --pattern '*Setup*.exe' --dir "$env:RUNNER_TEMP\old"
          $old = Get-ChildItem "$env:RUNNER_TEMP\old\*.exe" | Select-Object -First 1
          Write-Host "instalando a versão publicada: $($old.Name)"
          Install-Silent $old.FullName
          Start-Process $exe -ArgumentList '--smoke-test' -Wait
          Start-Sleep 2
          $save = "$data\saves\slot3.json.gz"
          if (!(Test-Path $save)) { throw "a 0.8.7 não criou o save" }
          $before = (Get-FileHash $save -Algorithm SHA256).Hash
          $new = Get-ChildItem release\*.exe | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          Write-Host "instalando por cima: $($new.Name)"
          Install-Silent $new.FullName
          $after = (Get-FileHash $save -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "a instalação da versão nova mudou o save da 0.8.7 ($before -> $after)" }
          Remove-Item "$data\smoke-verify.json" -ErrorAction SilentlyContinue
          Start-Process $exe -ArgumentList '--smoke-verify' -Wait
          Start-Sleep 2
          $v = Get-Content "$data\smoke-verify.json" | ConvertFrom-Json
          if (!$v.ok) { throw "o save da 0.8.7 não abriu na versão nova: $($v.error)" }
          Write-Host "Save da 0.8.7 intacto depois da instalação (SHA-256 $before) e aberto na versão $($v.version)."
          "## Atualização 0.8.7 -> $($v.version)`nSave intacto na instalação (SHA-256 $before) e aberto na versão nova." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Instalar silenciosamente e conferir atalhos
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\*.exe | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          Write-Host "Instalador: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"
          # Em runner recém-criado, a primeira execução às vezes trava (0xC0000005) enquanto o antivírus
          # termina de iniciar e atualizar; uma nova tentativa instala normalmente. Até 3 tentativas.
          for ($t = 1; $t -le 3; $t++) {
            $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
            Write-Host "tentativa ${t}: instalador terminou com código $($p.ExitCode)"
            if ($p.ExitCode -eq 0) { break }
            Start-Sleep 45
          }
          $exe = "$env:LOCALAPPDATA\Programs\PitWall Racing Simulator\PitWall Racing Simulator.exe"
          $alt = "$env:ProgramFiles\PitWall Racing Simulator\PitWall Racing Simulator.exe"
          # O NSIS pode devolver o controle antes de terminar, e no runner a verificação do instalador
          # (90 MB, sem assinatura) às vezes leva minutos: espera até 10 minutos, mostrando o progresso.
          for ($i = 0; $i -lt 300; $i++) {
            $busy = Get-Process | Where-Object { $_.Name -like 'PitWall-Racing-Simulator-Setup*' }
            if (((Test-Path $exe) -or (Test-Path $alt)) -and !$busy) { break }
            if ($i % 15 -eq 0) { Write-Host "aguardando instalação ($($i * 2) s; instalador ativo: $([bool]$busy))" }
            Start-Sleep 2
          }
          if (!(Test-Path $exe) -and (Test-Path $alt)) { Write-Host "Instalado para todos os usuários em $alt"; $exe = $alt }
          if (!(Test-Path $exe)) {
            Get-Process | Where-Object { $_.Name -like '*Setup*' -or $_.Name -like '*PitWall*' } | Format-Table Name, Id, StartTime -AutoSize | Out-String | Write-Host
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table Name | Out-String | Write-Host
            Write-Host "--- detecções do Microsoft Defender ---"
            Get-MpThreatDetection -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
            Get-MpThreat -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
            Write-Host "--- eventos do Defender (últimos) ---"
            Get-WinEvent -LogName 'Microsoft-Windows-Windows Defender/Operational' -MaxEvents 15 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message | Out-String -Width 400 | Write-Host
            Write-Host "--- tentativa com log do instalador em pasta fixa ---"
            $dir = "$env:RUNNER_TEMP\pitwall-inst"
            $p2 = Start-Process $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
            Write-Host "código $($p2.ExitCode)"; Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -First 20 | Format-Table Name, Length | Out-String | Write-Host
            throw "Executável não foi instalado em $exe"
          }
          $desk = @("$env:USERPROFILE\Desktop\PitWall Racing Simulator.lnk", "$env:PUBLIC\Desktop\PitWall Racing Simulator.lnk") | Where-Object { Test-Path $_ }
          if (!$desk) { throw "Atalho da área de trabalho não foi criado" }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PitWall Racing Simulator.lnk")) { throw "Atalho do menu Iniciar não foi criado" }
          "EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Abrir o jogo instalado, criar carreira, simular corridas, salvar, fechar e reabrir
        run: node scripts/smoke.js "${{ env.EXE }}"

      - name: Reinstalar (atualização) e desinstalar sem perder os saves
        shell: pwsh
        run: |
          $data = "$env:APPDATA\PitWall Racing Simulator"
          Start-Process "${{ env.EXE }}" -ArgumentList '--smoke-test' -Wait
          Start-Sleep 2
          if (!(Test-Path "$data\saves\slot3.json.gz")) { throw "Save não foi criado na pasta de dados do Windows" }
          Start-Process "${{ env.SETUP }}" -ArgumentList '/S' -Wait
          Get-Process | Where-Object { $_.Name -like 'PitWall-Racing-Simulator-Setup*' } | Wait-Process -Timeout 600 -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 300 -and !(Test-Path "${{ env.EXE }}"); $i++) { Start-Sleep 2 }
          if (!(Test-Path "$data\saves\slot3.json.gz")) { throw "Atualização apagou o save" }
          Start-Process "${{ env.EXE }}" -ArgumentList '--smoke-verify' -Wait
          Start-Sleep 2
          $v = Get-Content "$data\smoke-verify.json" | ConvertFrom-Json
          if (!$v.ok) { throw "Save não abriu após a atualização: $($v.error)" }
          # save real da 0.8.6 (JSON sem compactação, como aquela versão gravava) aberto pelo jogo instalado
          Remove-Item "$data\saves\slot3.json.gz", "$data\saves\slot3.meta.json" -ErrorAction SilentlyContinue
          $in = [IO.File]::OpenRead("$PWD\tests\saves\0.8.6-entre-etapas.json.gz")
          $gz = New-Object IO.Compression.GZipStream($in, [IO.Compression.CompressionMode]::Decompress)
          $out = [IO.File]::Create("$data\saves\slot3.json"); $gz.CopyTo($out); $out.Close(); $gz.Close(); $in.Close()
          Remove-Item "$data\smoke-verify.json" -ErrorAction SilentlyContinue
          Start-Process "${{ env.EXE }}" -ArgumentList '--smoke-verify' -Wait
          Start-Sleep 2
          $v = Get-Content "$data\smoke-verify.json" | ConvertFrom-Json
          if (!$v.ok) { throw "Save da 0.8.6 não abriu: $($v.error)" }
          if (!(Test-Path "$data\saves\slot3.json.gz")) { throw "Save da 0.8.6 não foi regravado compactado" }
          if (Test-Path "$data\saves\slot3.json") { throw "Save antigo ficou na pasta principal" }
          if (!(Get-ChildItem "$data\saves\backups" -Filter "slot3.*-antigo.json")) { throw "Save antigo não foi guardado nos backups" }
          Write-Host "Save da 0.8.6 aberto, continuado e regravado compactado; o original ficou nos backups."
          Start-Process (Join-Path (Split-Path "${{ env.EXE }}") "Uninstall PitWall Racing Simulator.exe") -ArgumentList '/S' -Wait
          Start-Sleep 3
          if (!(Test-Path "$data\saves\slot3.json.gz")) { throw "Desinstalar apagou os saves" }
          Write-Host "Saves preservados após atualizar e desinstalar."

      - uses: actions/upload-artifact@v7
        with:
          name: PitWall-Racing-Simulator-Windows
          path: release/*Setup*.exe

      - name: Versão
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version.replace(/-(\\d+)$/, '.\$1')")" >> "$GITHUB_OUTPUT"

      # (0.9, E25, decisão Q3 = b+) um instalador publicado nunca é trocado. Se a release desta versão já tem o Setup,
      # nada é publicado (aviso no resumo); se o push mudou o jogo (app/, desktop/ ou package.json) sem subir a versão,
      # o job falha pedindo a versão nova (x.y.z-1).
      - name: Conferir a release desta versão
        id: rel
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          assets=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if ! grep -q 'Setup' <<< "$assets"; then echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Release $TAG sem Setup: será publicada."; exit 0; fi
          echo "publish=false" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only HEAD^ HEAD -- app desktop package.json 2>/dev/null || true)
          if [ -n "$changed" ]; then
            echo "::error::A release $TAG já tem o instalador e este push mudou o jogo: suba a versão (x.y.z-1) antes de publicar."
            { echo "## Publicação bloqueada"; echo "A release \`$TAG\` já tem o instalador e este push mudou:"; echo '```'; echo "$changed"; echo '```'; echo "Suba a versão (x.y.z-1) antes de publicar."; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::warning::A release $TAG já tem o instalador; nada foi publicado (o instalador publicado nunca é trocado)."
          { echo "## Nada publicado"; echo "A release \`$TAG\` já tem o instalador e este push não mudou o jogo."; } >> "$GITHUB_STEP_SUMMARY"

      # Nada desatualizado é lançado: qualquer versão nova pendente bloqueia a publicação
      - name: Atualizações pendentes bloqueiam o lançamento
        if: steps.rel.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/freshness-check.js --release

      # Cada versão aprovada nos testes acima vira uma release com o Setup.exe para download
      - name: Publicar release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PitWall Racing Simulator ${{ steps.v.outputs.version }}
          make_latest: true
          overwrite_files: false   # um instalador publicado nunca é trocado (regra 7)
          files: release/*Setup*.exe
          body: |
            **Download:** `PitWall-Racing-Simulator-Setup-${{ steps.v.outputs.version }}.exe` (em Assets, abaixo).

            Instalador para Windows 10/11 (64 bits), gerado e testado automaticamente em Windows: instalação, atalhos na área de trabalho e no menu Iniciar, corrida pela interface, salvar e reabrir, atualização e desinstalação sem perda de saves.

            Ao abrir, o Windows pode mostrar "O Windows protegeu o computador" porque o executável não tem assinatura digital paga: clique em **Mais informações → Executar assim mesmo**.
