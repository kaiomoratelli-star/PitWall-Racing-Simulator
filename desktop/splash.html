<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'unsafe-inline'">
<title>PitWall</title>
<link rel="stylesheet" href="../app/dist/assets/fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #0d1015; color: #e9edf2; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden; -webkit-app-region: drag; user-select: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 44px; box-sizing: border-box; gap: 18px; border: 1px solid #262f3c; }
  .slash { width: 46px; height: 22px; background: repeating-linear-gradient(115deg, #ffb81c 0 6px, transparent 6px 12px); }
  .logo { font-family: 'Saira Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 64px; line-height: .85; }
  .logo em { font-style: normal; color: #ffb81c; }
  .sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #8592a3; text-transform: uppercase; }
  .bar { height: 3px; background: #1c232d; overflow: hidden; border-radius: 2px; }
  .bar i { display: block; height: 100%; width: 35%; background: #ffb81c; animation: run 1.1s ease-in-out infinite; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
</style></head>
<body><div class="wrap">
  <div class="slash"></div>
  <div class="logo">PIT <em>WALL</em></div>
  <div class="sub">Racing Simulator · <span id="v"></span> · carregando o paddock</div>
  <div class="bar"><i></i></div>
</div>
<script>document.getElementById('v').textContent = 'v' + (new URLSearchParams(location.search).get('v') || '');</script>
</body></html>
