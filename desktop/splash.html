<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; script-src 'unsafe-inline'">
<title>PitWall Racing Simulator</title>
<link rel="stylesheet" href="../app/dist/assets/fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; color: #fff; font-family: 'Titillium Web', system-ui, sans-serif; overflow: hidden; -webkit-app-region: drag; user-select: none; }
  .wrap { position: relative; height: 100%; box-sizing: border-box; border: 1px solid #2a2a35; overflow: hidden; }
  .photo { position: absolute; inset: 0; background: url('../app/dist/assets/img/tracks/marina-bay-hero.webp') 70% 50% / cover no-repeat; opacity: 0; animation: fade 1.2s .1s ease forwards; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #0b0b10 0%, rgba(11,11,16,.92) 38%, rgba(11,11,16,.35) 75%, rgba(11,11,16,.6) 100%), linear-gradient(0deg, #0b0b10 0%, transparent 35%); }
  .stripes { position: absolute; top: 26px; right: -8px; width: 120px; height: 14px; background: repeating-linear-gradient(115deg, #E10600 0 9px, transparent 9px 18px); }
  .by { position: absolute; left: 40px; top: 30px; display: flex; align-items: center; gap: 12px; opacity: 0; animation: up .6s .15s ease forwards; }
  .by img { height: 30px; }
  .by span { font-size: 11px; font-weight: 700; letter-spacing: .22em; color: #9a9aa5; text-transform: uppercase; }
  .main { position: absolute; left: 40px; bottom: 74px; opacity: 0; animation: up .7s .35s ease forwards; }
  .logo { font-weight: 900; font-style: italic; font-size: 92px; line-height: .84; letter-spacing: -.02em; text-shadow: 0 6px 24px rgba(0,0,0,.6); }
  .logo em { font-style: normal; color: #E10600; }
  .tag { margin-top: 12px; font-weight: 700; font-size: 13px; letter-spacing: .34em; color: #d7d7dc; }
  .foot { position: absolute; left: 40px; right: 40px; bottom: 26px; display: flex; align-items: center; gap: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .08em; color: #8a8a96; text-transform: uppercase; }
  .bar { flex: 1; height: 3px; background: rgba(255,255,255,.12); overflow: hidden; border-radius: 2px; }
  .bar i { display: block; height: 100%; width: 32%; background: #E10600; animation: run 1.1s ease-in-out infinite; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(320%); } }
  @keyframes fade { to { opacity: .85; } }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .photo, .by, .main { animation: none; opacity: 1; } }
</style></head>
<body><div class="wrap">
  <div class="photo"></div><div class="shade"></div><div class="stripes"></div>
  <div class="by"><img src="../app/dist/assets/img/brand/mgc-logo.png" alt="Moratelli Game Company"><span>apresenta</span></div>
  <div class="main"><div class="logo">PIT <em>WALL</em></div><div class="tag">RACING SIMULATOR</div></div>
  <div class="foot"><span id="v"></span><div class="bar"><i></i></div><span>Carregando o paddock</span></div>
</div>
<script>document.getElementById('v').textContent = 'v' + (new URLSearchParams(location.search).get('v') || '');</script>
</body></html>
